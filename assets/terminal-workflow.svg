<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-labelledby="title desc">
  <title id="title">n8n-manager-mcp Stdio Workflow and Safety Gate Preview</title>
  <desc id="desc">Dark-mode terminal preview showing MCP stdio tool discovery, multi-server health check, offline node catalog lookup, pre-mutation snapshot backup, and monotonic read-only enforcement.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect x="0" y="0" width="880" height="540" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Header Bar -->
  <rect x="0" y="0" width="880" height="42" rx="14" fill="url(#headerGrad)" />
  <rect x="0" y="28" width="880" height="14" fill="url(#headerGrad)" />
  <line x1="0" y1="42" x2="880" y2="42" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- Header Title -->
  <text x="440" y="25" text-anchor="middle" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
    n8n-manager-mcp v0.1.21 — MCP Stdio (19 Tools) &amp; Safety Invariants
  </text>

  <!-- Badge Pill -->
  <rect x="738" y="10" width="124" height="22" rx="11" fill="#1f2937" stroke="#3b82f6" stroke-width="1" />
  <text x="800" y="25" text-anchor="middle" fill="#60a5fa" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">
    stdio · local-first
  </text>

  <!-- Terminal Content -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">
    <!-- Step 1: Smoke & Discovery -->
    <text x="24" y="74" fill="#34d399" font-weight="700">$ npm run smoke</text>
    <text x="24" y="95" fill="#93c5fd">MCP smoke passed: 19 tools listed and n8n_describe_nodes responded.</text>

    <!-- Divider -->
    <line x1="24" y1="112" x2="856" y2="112" stroke="#1f2937" stroke-width="1" />

    <!-- Step 2: Multi-server registration & ping -->
    <text x="24" y="136" fill="#fbbf24" font-weight="700">&gt; n8n_add_server</text>
    <text x="160" y="136" fill="#9ca3af">{"name": "staging", "url": "http://127.0.0.1:5678", "is_default": true}</text>
    <text x="24" y="157" fill="#d1d5db">Server "staging" added (http://127.0.0.1:5678). Set as default.</text>

    <text x="24" y="182" fill="#fbbf24" font-weight="700">&gt; n8n_ping_server</text>
    <text x="160" y="182" fill="#9ca3af">{"server_name": "staging"}</text>
    <text x="24" y="203" fill="#34d399">Server "staging" (http://127.0.0.1:5678) is reachable. Response time: 18ms</text>

    <!-- Divider -->
    <line x1="24" y1="220" x2="856" y2="220" stroke="#1f2937" stroke-width="1" />

    <!-- Step 3: Offline Node Catalog -->
    <text x="24" y="244" fill="#fbbf24" font-weight="700">&gt; n8n_describe_nodes</text>
    <text x="190" y="244" fill="#9ca3af">{"category": "action"}  # INV-NODE-09 (zero network call)</text>
    <text x="24" y="265" fill="#a78bfa">[ACTION] n8n-nodes-base.httpRequest  — Make HTTP requests (url, method, headers, body)</text>
    <text x="24" y="285" fill="#a78bfa">[ACTION] n8n-nodes-base.slack        — Send messages to Slack channels</text>

    <!-- Divider -->
    <line x1="24" y1="302" x2="856" y2="302" stroke="#1f2937" stroke-width="1" />

    <!-- Step 4: Safe Mutation with Backup -->
    <text x="24" y="326" fill="#fbbf24" font-weight="700">&gt; n8n_update_workflow</text>
    <text x="200" y="326" fill="#9ca3af">{"workflow_id": "42", "server_name": "staging", ...}</text>
    <text x="24" y="347" fill="#34d399">Workflow 42 updated successfully on staging.</text>
    <text x="24" y="367" fill="#60a5fa">Backup saved (INV-BACK-03): ~/.n8n-manager-mcp/backups/staging/42-update.json</text>
    <text x="24" y="387" fill="#9ca3af">Audit appended (INV-AUDIT-04): ~/.n8n-manager-mcp/audit.log</text>

    <!-- Divider -->
    <line x1="24" y1="404" x2="856" y2="404" stroke="#1f2937" stroke-width="1" />

    <!-- Step 5: Fail-Closed Read-Only Ceiling -->
    <text x="24" y="428" fill="#fbbf24" font-weight="700">&gt; N8N_MANAGER_READ_ONLY=1  -&gt;  n8n_delete_workflow</text>
    <text x="462" y="428" fill="#9ca3af">{"workflow_id": "42"}</text>
    <text x="24" y="449" fill="#f87171" font-weight="600">Blocked (INV-READ-02): n8n Manager is in read-only mode (process ceiling active).</text>
  </g>

  <!-- Footer Invariant Strip -->
  <rect x="20" y="476" width="840" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <text x="36" y="503" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
    Guardrails:
  </text>
  <rect x="120" y="487" width="128" height="22" rx="6" fill="#064e3b" />
  <text x="184" y="502" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">INV-BACK-03 Snapshot</text>

  <rect x="260" y="487" width="134" height="22" rx="6" fill="#1e3a8a" />
  <text x="327" y="502" text-anchor="middle" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">INV-READ-02 Ceiling</text>

  <rect x="406" y="487" width="130" height="22" rx="6" fill="#312e81" />
  <text x="471" y="502" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">INV-AUDIT-04 Log</text>

  <rect x="548" y="487" width="142" height="22" rx="6" fill="#374151" />
  <text x="619" y="502" text-anchor="middle" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">INV-SRV-05 Profiles</text>

  <rect x="702" y="487" width="144" height="22" rx="6" fill="#3b0764" />
  <text x="774" y="502" text-anchor="middle" fill="#e9d5ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">INV-NODE-09 Offline</text>
</svg>
